# Claude builds; the reviewer agent verifies; Joseph merges (CLAUDE.md § "Autonomous build loop").
# Ported from enrichmeai/valuedocs via enrichmeai/culvert (2026-09-26).
#
# Trigger: a comment that STARTS with "@claude" on an issue or PR, or the `claude` label on an issue,
# and only when the actor AND the issue/PR author are Joseph's account. This repo is public, so
# nobody else can start a run or get their text into one.
#
# Needs one repository secret, CLAUDE_CODE_OAUTH_TOKEN (Joseph: `claude setup-token`, then
# Settings → Secrets and variables → Actions). Until it exists, a run fails at the action step.
#
# What this workflow can NOT do, by construction:
#   - reach a cloud account: there is no `id-token: write` and no cloud credential is passed in; the
#     LocalStack tests run in Docker on the runner.
#   - publish: no Central Portal or GPG secret is passed in, and `mvn deploy` and tags are disallowed below.
#   - edit workflows: GITHUB_TOKEN has no `workflows` permission, so a push that changes
#     .github/workflows/ is refused by GitHub.
#   - merge, tag or dispatch: disallowed below. Joseph merges.
#   - run two at once: one concurrency group per repository, never cancelled mid-run.
#
# Note: pushes made with GITHUB_TOKEN do not start other workflows. The `build` workflow runs when
# Joseph's account opens the PR from Claude's branch, and the builder runs `mvn -B verify` itself.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: claude-${{ github.repository }}
  cancel-in-progress: false

jobs:
  claude:
    # Both the actor AND the author of the issue or PR must be Joseph: the action puts the
    # issue/PR body into Claude's context, so his comment on someone else's issue must not
    # carry that body into a run with contents: write.
    if: >-
      github.actor == 'josepharuja' &&
      (github.event.issue.user.login == 'josepharuja' || github.event.pull_request.user.login == 'josepharuja') && (
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && startsWith(github.event.comment.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.label.name == 'claude')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Pinned to the commit behind the v1 tag (the same pin valuedocs uses, 2026-09-24): a third-party
      # action that receives a write token is pinned by SHA, not by a movable tag.
      - uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token, not the Claude GitHub App: the App path needs id-token: write.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: claude
          include_comments_by_actor: josepharuja
          branch_prefix: claude/
          claude_args: >-
            --model opus
            --max-turns 120
            --disallowedTools "Bash(gh pr merge:*),Bash(gh workflow:*),Bash(gh api:*),Bash(gh release:*),Bash(git tag:*),Bash(git push origin main:*),Bash(git push --tags:*),Bash(aws:*),Bash(gcloud:*),Bash(mvn deploy:*),Bash(mvn -Prelease:*),Bash(curl:*)"
            --append-system-prompt "You are the builder: Claude builds, the reviewer agent verifies, Joseph merges. CLAUDE.md in this repository governs everything you do; follow the /build-task skill (verify external APIs against the pinned docs first, red then green, run the reviewer agent before replying, at most 3 fix attempts then a Blocker summary, then /compound). Work only on the task in the triggering issue or comment; if it is ambiguous, reply with the question and stop. One branch per task, off main, PR into main. Keep every cloud SDK out of test-core. Prove every behaviour change red first, then green, and quote both with the exact mvn command and counts; Docker is available here, so run mvn -B verify before replying. Never relax a test, lower a coverage floor, widen a permission, merge, tag, publish, dispatch a workflow, or touch .github/workflows. End every reply with: branch, head SHA, files changed, tests run with their result, and anything left for Joseph (the DCO sign-off is always his)."
