name: build

on:
  push:
    branches: [ main ]
  # No branch filter here on purpose: a stacked pull request whose base is another
  # feature branch must still be tested. Filtering pull_request to `main` silently
  # gave stacked PRs no CI at all.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (IT with Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'
      - name: Docker info (debug)
        run: |
          docker version
          docker info
      # A plain `verify` runs unit tests (Surefire), the LocalStack integration
      # tests and Cucumber suites (Failsafe), Spotless, Checkstyle, Enforcer and
      # the per-module JaCoCo coverage floors. No skip flags.
      - name: Build and test (full verify)
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
      # Produced by the same run above, so the HTML always matches the tests
      # that were actually executed.
      - name: Upload coverage (JaCoCo HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jacoco
          path: |
            **/target/site/jacoco/**
            **/target/site/jacoco-aggregate/**
