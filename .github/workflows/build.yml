name: build

on:
  push:
    branches: [ main ]
  # No branch filter here on purpose: a stacked pull request whose base is another
  # feature branch must still be tested. Filtering pull_request to `main` silently
  # gave stacked PRs no CI at all.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (IT with Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'
      - name: Docker info (debug)
        run: |
          docker version
          docker info
      # A plain `verify` runs unit tests (Surefire), the LocalStack integration
      # tests and Cucumber suites (Failsafe), Spotless, Checkstyle, Enforcer and
      # the per-module JaCoCo coverage floors. No skip flags.
      - name: Build and test (full verify)
        run: mvn -B verify
      # The coverage each module measured, as numbers in the log and the job summary, so
      # STATUS.md and the coverage stories can quote a run instead of downloading the HTML.
      - name: Coverage totals (JaCoCo)
        # Not after a cancelled run, and never the reason a job fails: it only reports.
        if: success() || failure()
        continue-on-error: true
        run: |
          {
            echo "| Module | Line | Branch |"
            echo "| --- | --- | --- |"
            for csv in */target/site/jacoco/jacoco.csv; do
              [ -f "$csv" ] || continue
              awk -F, -v m="${csv%%/*}" 'NR>1 {bm+=$6; bc+=$7; lm+=$8; lc+=$9}
                END {printf "| %s | %d/%d, %.4f | %d/%d, %.4f |\n", m, lc, lc+lm, (lc+lm ? lc/(lc+lm) : 0), bc, bc+bm, (bc+bm ? bc/(bc+bm) : 0)}' "$csv"
            done
            echo
            echo "Classes with uncovered branches (module, class, branches missed/total, lines missed/total):"
            echo
            for csv in */target/site/jacoco/jacoco.csv; do
              [ -f "$csv" ] || continue
              awk -F, -v m="${csv%%/*}" 'NR>1 && $6>0 {printf "- %s %s.%s: %d/%d branches, %d/%d lines\n", m, $2, $3, $6, $6+$7, $8, $8+$9}' "$csv"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
      # Produced by the same run above, so the HTML always matches the tests
      # that were actually executed.
      - name: Upload coverage (JaCoCo HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jacoco
          path: |
            **/target/site/jacoco/**
            **/target/site/jacoco-aggregate/**
