name: release

# Publishes enrich-test-api to Maven Central through the Sonatype Central Portal. See ADR 0010
# (this trigger, ported from enrichmeai/culvert's publish-maven.yml) and ADR 0009 (the bundle).
#
# A RELEASE IS THE MERGE OF A RELEASE PR. The release PR sets every POM to the release version
# (X.Y.Z or X.Y.Z-qualifier, never -SNAPSHOT) and turns CHANGELOG.md's [Unreleased] into that
# version's section. When it merges, the `gate` job (scripts/release/gate.py) uploads only if the
# push changed the root POM's version, the version is a release version, it is not already on
# Maven Central, CHANGELOG.md has its "## [X.Y.Z...]" section, and every module POM carries it.
# Any later pom.xml edit while the bundle waits in validation is therefore a no-op.
#
# The upload stops at the Portal's VALIDATED stage (autoPublish=false in the root POM). Pressing
# Publish on central.sonatype.com stays a person's act, and a published version is permanent.
# The manual run, with the typed confirm phrase, is the retry after a Portal-side failure.
#
# Repository (or organisation) secrets, the same names as culvert's so one key and one token serve
# both; agents never handle them:
#   MAVEN_GPG_PRIVATE_KEY   ASCII-armoured private key (gpg --export-secret-keys --armor <KEY_ID>),
#                           public half on keyserver.ubuntu.com
#   MAVEN_GPG_PASSPHRASE    its passphrase
#   CENTRAL_USERNAME        Central Portal user token, username half (not the account login)
#   CENTRAL_PASSWORD        Central Portal user token, password half
# The names ADR 0009 used (GPG_PRIVATE_KEY, GPG_PASSPHRASE, MAVEN_CENTRAL_USERNAME,
# MAVEN_CENTRAL_PASSWORD) are still read as a fallback.

on:
  push:
    branches: [main]
    paths: [pom.xml]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish-maven" to upload the version on main to the Central Portal'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the gate reads pom.xml at the push's `before` commit
      - name: Gate tests
        run: python3 -m unittest scripts/release/test_gate.py -v
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: >-
          python3 scripts/release/gate.py --event "$EVENT" --confirm "$CONFIRM"
          --before "$BEFORE" --ref "$REF"

  verify:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    name: Verify and assemble the bundle (JDK 17, no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # The full lifecycle, as `build` runs it: unit tests, the LocalStack integration tests,
      # Spotless, Checkstyle, Enforcer and the JaCoCo floors.
      - name: Full verify
        run: mvn -B verify
      # The release profile without signing proves sources and javadoc attach before any secret
      # is touched. test-feature is not published (ADR 0009).
      - name: Assemble the release jars (unsigned)
        run: mvn -B -Prelease -Dgpg.skip -DskipTests -pl '!test-feature' install
      - name: Assert every published module has main + sources + javadoc
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          missing=0
          for m in test-core test-cloud-aws; do
            for suffix in "" "-sources" "-javadoc"; do
              f="$m/target/$m-$VERSION$suffix.jar"
              if [ -f "$f" ]; then echo "ok $f"; else echo "MISSING $f"; missing=1; fi
            done
          done
          exit $missing

  deploy:
    needs: [gate, verify]
    if: needs.gate.outputs.release == 'true'
    name: Sign and upload to the Central Portal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-central
    permissions:
      contents: write   # the GitHub release and its v* tag, after the upload
    steps:
      - uses: actions/checkout@v4
      # setup-java writes ~/.m2/settings.xml with a `central` server whose credentials are read
      # from the named environment variables at build time, and imports the GPG key.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY || secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # Tests ran in `verify` on this commit. The plugin uploads from the last module in the
      # reactor; leaving test-feature out keeps that a published one (ADR 0009).
      - name: Deploy to the Central Portal (validation stage; a person presses Publish)
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME || secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD || secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE || secrets.GPG_PASSPHRASE }}
        run: mvn -B -Prelease -DskipTests -pl '!test-feature' deploy
      - name: Upload the signed artifacts as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.gate.outputs.version }}
          path: |
            test-core/target/*.jar
            test-core/target/*.asc
            test-cloud-aws/target/*.jar
            test-cloud-aws/target/*.asc
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION already has a GitHub release"; exit 0
          fi
          flags="--generate-notes"
          case "$VERSION" in *-*) flags="$flags --prerelease" ;; esac
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" $flags
