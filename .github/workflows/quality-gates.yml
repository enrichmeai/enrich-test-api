name: quality-gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Spotless/Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'
      - name: Spotless check
        run: mvn -B -DskipTests=true spotless:check
      - name: Checkstyle
        run: mvn -B -DskipTests=true checkstyle:check

  static:
    name: Static/build hygiene (Enforcer)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'
      - name: Enforcer validate
        run: mvn -B -DskipTests=true validate

  errorprone:
    name: Error Prone
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'
      # Compiles main and test sources with Error Prone on javac's processor
      # path. Findings at ERROR severity fail the build; WARN findings do not.
      - name: Compile with Error Prone profile
        run: mvn -B -DskipTests=true -Perrorprone verify

  deps:
    name: Dependencies audit (OWASP)
    runs-on: ubuntu-latest
    needs: errorprone
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'
      # dependency-check cannot populate its database without an NVD API key, so
      # this step is skipped until the NVD_API_KEY secret exists on the repo.
      # The plugin version is NOT repeated here: the `owasp` profile in pom.xml
      # declares it, and a direct goal invocation resolves the declared version.
      - name: OWASP Dependency-Check
        if: ${{ env.NVD_API_KEY != '' }}
        run: mvn -B -Powasp org.owasp:dependency-check-maven:check
      - name: Report that the audit was skipped
        if: ${{ env.NVD_API_KEY == '' }}
        run: |
          echo "::warning::OWASP Dependency-Check skipped: no NVD_API_KEY secret is set on this repository."
      - name: Upload OWASP reports
        if: ${{ always() && env.NVD_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check
          path: |
            **/target/dependency-check-report.*
